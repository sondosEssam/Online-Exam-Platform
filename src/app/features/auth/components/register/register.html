
<main class=" min-h-screen-110vh w-[100%] md:min-h-screen flex flex-col justify-center items-center md:px-6 px-1 py-4  ">
<form  class="flex flex-col space-y-2  w-[85%] md:w-[60%] overflow-y-auto" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <h1 class="text-2xl font-bold self-start">Create Account</h1>


<div class="flex flex-col md:flex-row">
<app-form-input
[control]="registerForm.controls.firstName"
[label]="'First Name'"
[placeHolder]="'first name'"
[errorMessage]="'name is requiered'"
[type]="'text'"
class="flex-grow mr-2"
>
</app-form-input>
<app-form-input
[control]="registerForm.controls.lastName"
[label]="'Last Name'"
[placeHolder]="'last name'"
[errorMessage]="'name is requiered'"
[type]="'text'"
class="flex-grow"
>
</app-form-input>
</div>
<app-form-input
[control]="registerForm.controls.username"
[label]="'user Name'"
[placeHolder]="'user name'"
[errorMessage]="'name is requiered'"
[type]="'text'"
>

</app-form-input>

<app-form-input
[control]="registerForm.controls.email"
[label]="'Email'"
[placeHolder]="'email@example.com'"
[errorMessage]="'email is reuiqred'"
[type]="'email'"
></app-form-input>



<app-form-input
[control]="registerForm.controls.phone"
[label]="'Phone Number'"
[placeHolder]="'Enter your phone number'"
[errorMessage]="'phone number is requiered'"
[type]="'tel'"
></app-form-input>



<app-form-input
[control]="registerForm.controls.password"
[label]="'Password'"
[placeHolder]="'*****'"
[errorMessage]="'Password must be at least 8 characters long and include uppercase, lowercase, number, and special character.'"
[type]="'password'"
>
</app-form-input>


<app-form-input
[control]="registerForm.controls.rePassword"
[label]="'Confirm Password'"
[placeHolder]="'******'"
[errorMessage]="'repassword is requiered'"
[type]="'password'"
class="mb-2"
>
</app-form-input>

<button authButton type="submit" class="my-5">Register</button>
<p class="text-gray-600 text-center">Already have an account? <a class="text-blue-600 hover:text-blue-800" routerLink="/auth/login">Login</a></p>


</form>
</main>
